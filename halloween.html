
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The House of Everyday Horrors</title>

<style>
:root {
  --red: #ff563d;
  --orange: #ffad70;
  --black: #090807;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(
    ellipse at center,
    #302019 0%,
    #100c0b 65%,
    #050404 100%
  );
  color: #f3d9c4;
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.machine {
  width: min(100%, 680px);
  background: linear-gradient(135deg, #211916, #090807);
  border: 8px ridge #4c3025;
  border-radius: 12px;
  padding: 22px;
  box-shadow:
    0 0 35px #000,
    inset 0 0 25px #000;
}

header {
  text-align: center;
  padding: 12px 0 24px;
}

.skull {
  font-size: 38px;
  margin-bottom: 8px;
}

h1 {
  margin: 0;
  color: #e9674d;
  font-size: clamp(24px, 5vw, 43px);
  line-height: 1.1;
  text-shadow: 0 0 14px #6a1a10;
}

.subtitle {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  margin-top: 14px;
  color: #a78a79;
}

.windows {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
}

.window {
  position: relative;
  aspect-ratio: 1.12;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  padding: 9px;
  background: #080808;
  border: 5px ridge #49332b;
  border-radius: 4px;
  box-shadow: inset 0 0 22px #000;
  transition:
    background 0.3s ease,
    box-shadow 0.3s ease;
}

.window::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    130deg,
    transparent 15%,
    #ffffff08 35%,
    transparent 50%
  );
}

.message {
  opacity: 0;
  visibility: hidden;
  color: #1b0905;
  font-family: Impact, "Arial Narrow", sans-serif;
  font-weight: 900;
  font-size: 18px;
  line-height: 1.15;
  text-align: center;
  overflow-wrap: break-word;
  transform: scale(0.97);
  transition:
    opacity 0.2s ease,
    transform 0.2s ease,
    visibility 0s linear 0.2s;
}

.window.active {
  background: radial-gradient(
    ellipse,
    #ffb27b 0%,
    #ff6547 45%,
    #9b241b 100%
  );
  box-shadow:
    0 0 18px #ff3d27aa,
    0 0 42px #ff3d2744,
    inset 0 0 20px #6c120c;
  border-color: #a65a3d;
}

.window.active .message {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
  transition:
    opacity 0.2s ease,
    transform 0.2s ease,
    visibility 0s;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 25px;
}

button {
  border: 1px solid #a4563d;
  background: #351711;
  color: #ffe0cc;
  border-radius: 5px;
  padding: 13px 18px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
}

button:hover {
  background: #67291c;
}

button:focus-visible {
  outline: 3px solid #ffbc85;
  outline-offset: 3px;
}

#trigger {
  background: #a52e20;
  border-color: #ff7855;
  font-size: 15px;
}

#trigger:hover {
  background: #c63d2a;
}

#status {
  text-align: center;
  margin-top: 18px;
  font: 12px Arial, sans-serif;
  letter-spacing: 1px;
  color: #bda99d;
  min-height: 18px;
}

.footer {
  text-align: center;
  margin-top: 12px;
  font: 11px Arial, sans-serif;
  color: #7f6b60;
}

@media (max-width: 480px) {
  body { padding: 8px; }
  .machine { padding: 10px; border-width: 5px; }
  .windows { gap: 4px; }
  .window { padding: 4px; border-width: 3px; }
  .subtitle { letter-spacing: 2px; }
}
</style>
</head>

<body>

<main class="machine">
  <header>
    <div class="skull" aria-hidden="true">☠</div>
    <h1>THE HOUSE OF<br>EVERYDAY HORRORS</h1>
    <div class="subtitle">ONE STEP. ONE NIGHTMARE.</div>
  </header>

  <section class="windows" aria-label="Nine nightmare windows">
    <div class="window"><div class="message"></div></div>
    <div class="window"><div class="message"></div></div>
    <div class="window"><div class="message"></div></div>
    <div class="window"><div class="message"></div></div>
    <div class="window"><div class="message"></div></div>
    <div class="window"><div class="message"></div></div>
    <div class="window"><div class="message"></div></div>
    <div class="window"><div class="message"></div></div>
    <div class="window"><div class="message"></div></div>
  </section>

  <div class="controls">
    <button id="trigger">☠ TRIGGER A NIGHTMARE</button>
    <button id="sound">🔊 SOUND ON</button>
    <button id="fullscreen">⛶ FULLSCREEN</button>
  </div>

  <div id="status" role="status" aria-live="polite">
    AWAITING YOUR NEXT VICTIM...
  </div>

  <div class="footer">
    PRESS SPACE TO TRIGGER
  </div>
</main>

<script>
const horrors = [
  // Original nine
  "YOU LEFT THE STOVE ON.",
  "YOUR MIC WAS ON THE WHOLE TIME.",
  "YOU CLICKED REPLY ALL.",
  "YOU JUST LIKED A PHOTO FROM 2017.",
  "YOU JUST CALLED YOUR TEACHER MOM.",
  "YOUR PHONE CONNECTED TO THE BLUETOOTH SPEAKER.",
  'SOMEONE SAYS, "REMEMBER ME?"',
  "YOU'RE THE ONLY ONE WEARING A COSTUME.",
  "IT'S TIME FOR ICEBREAKERS.",

  // Social humiliation
  "YOU WAVED. THEY WEREN'T WAVING AT YOU.",
  'YOU JUST SAID "YOU TOO" TO "ENJOY YOUR MEAL."',
  "YOU'VE BEEN CALLING THEM THE WRONG NAME FOR YEARS.",
  "YOU WENT IN FOR A HUG. THEY WENT FOR A HANDSHAKE.",
  "YOU JUST LAUGHED AT SOMETHING SERIOUS.",
  "YOU SAID GOODBYE. YOU'RE WALKING THE SAME WAY.",
  "YOU JUST REALIZED YOUR ZIPPER IS DOWN.",
  "YOU STARTED CLAPPING. NOBODY JOINED.",
  "YOU'RE THE ONLY ONE WHO DIDN'T GET THE JOKE.",
  'SOMEONE JUST SAID, "YOU LOOK TIRED."',

  // Digital disasters
  "YOU SENT THE SCREENSHOT TO THE PERSON IN IT.",
  "YOUR SCREEN IS STILL SHARING.",
  "YOUR SEARCH HISTORY IS ON THE BIG SCREEN.",
  "YOU ACCIDENTALLY STARTED A VIDEO CALL.",
  "YOU SENT A HEART EMOJI TO YOUR BOSS.",
  "YOU JUST LIKED YOUR EX'S ENGAGEMENT PHOTO.",
  'YOUR AUTOCORRECT CHANGED "THANKS" TO "THONGS."',
  "YOU POSTED IT TO YOUR STORY. NOT CLOSE FRIENDS.",
  "YOU JUST SENT A VOICE NOTE TO THE GROUP CHAT.",
  "YOUR PHONE STARTED READING YOUR TEXTS OUT LOUD.",

  // Workplace and school
  'THE MEETING STARTS WITH "LET\'S GO AROUND THE ROOM."',
  'THE TEACHER SAYS, "FIND A PARTNER."',
  'YOUR BOSS SAYS, "CAN YOU STAY AFTER?"',
  "YOU FORGOT THERE WAS A PRESENTATION TODAY.",
  "EVERYONE IS WAITING FOR YOU TO SPEAK.",
  'YOU JUST SAID "LOVE YOU" AT THE END OF A WORK CALL.',
  'THE PROFESSOR SAYS, "ANY VOLUNTEERS?"',
  "YOU'VE BEEN IN THE WRONG ZOOM MEETING FOR 20 MINUTES.",
  'YOUR EMAIL BEGINS "AS PER MY LAST EMAIL."',
  'SOMEONE SAYS, "LET\'S DO A FUN TEAM-BUILDING ACTIVITY."',

  // Domestic panic
  "YOU HEAR THE TOILET WATER RISING.",
  "YOU JUST REMEMBERED THE LAUNDRY IN THE WASHER.",
  "YOUR PHONE ISN'T IN YOUR POCKET.",
  "YOU LEFT YOUR KEYS INSIDE. THE DOOR LOCKED.",
  "YOU HEAR GLASS BREAKING IN THE OTHER ROOM.",
  "THE SMOKE ALARM CHIRPS AT 3 A.M.",
  "YOU JUST REMEMBERED THE PARKING METER.",
  "YOU FORGOT TO CANCEL THE FREE TRIAL.",
  'YOUR CHILD SAYS, "I NEED A COSTUME TOMORROW."',
  "YOU JUST REMEMBERED TOMORROW IS PICTURE DAY.",

  // Existential embarrassment
  'SOMEONE ASKS, "WHEN ARE YOU DUE?" YOU\'RE NOT PREGNANT.',
  'YOU JUST SAID "HAPPY BIRTHDAY" TO THE WRONG PERSON.',
  "YOU'VE BEEN TALKING WITH SPINACH IN YOUR TEETH.",
  "YOUR STOMACH GROWLS DURING A MOMENT OF SILENCE.",
  "YOU JUST REALIZED YOU'RE ON SPEAKERPHONE.",
  'THE CASHIER SAYS, "DECLINED." THE LINE IS LONG.',
  'YOU SAID "NICE TO MEET YOU." THEY\'RE YOUR NEIGHBOR.',
  "YOU'RE THE ONLY ONE WHO DRESSED FORMALLY.",
  'SOMEONE SAYS, "I HAVE A QUESTION ABOUT YOUR SEARCH HISTORY."',
  "YOU JUST REALIZED YOU'VE BEEN TALKING TO A MUTED PHONE."
];

const windows = Array.from(
  document.querySelectorAll(".window")
);

const triggerButton = document.getElementById("trigger");
const soundButton = document.getElementById("sound");
const fullscreenButton = document.getElementById("fullscreen");
const statusElement = document.getElementById("status");

let messagePool = [];
let lastWindow = -1;
let lastMessage = -1;
let soundEnabled = true;
let resetTimer = null;
let audioContext = null;

const AudioContextClass =
  window.AudioContext || window.webkitAudioContext;

// Fisher-Yates shuffle
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Every message is shown once before repeating.
// Also avoid repeating the final message across pool resets.
function refillPool() {
  messagePool = shuffle(
    horrors.map((_, index) => index)
  );

  if (
    messagePool.length > 1 &&
    messagePool[messagePool.length - 1] === lastMessage
  ) {
    const first = messagePool[0];
    messagePool[0] = messagePool[messagePool.length - 1];
    messagePool[messagePool.length - 1] = first;
  }
}

function nextMessageIndex() {
  if (messagePool.length === 0) {
    refillPool();
  }

  const index = messagePool.pop();
  lastMessage = index;
  return index;
}

function nextWindowIndex() {
  let index;

  do {
    index = Math.floor(Math.random() * windows.length);
  } while (
    windows.length > 1 &&
    index === lastWindow
  );

  lastWindow = index;
  return index;
}

// Resize text so long horrors fit in their windows.
function fitText(messageElement) {
  const parent = messageElement.parentElement;
  const styles = getComputedStyle(parent);

  const availableWidth =
    parent.clientWidth -
    parseFloat(styles.paddingLeft) -
    parseFloat(styles.paddingRight);

  const availableHeight =
    parent.clientHeight -
    parseFloat(styles.paddingTop) -
    parseFloat(styles.paddingBottom);

  let size = 22;

  messageElement.style.width = "100%";

  while (size >= 9) {
    messageElement.style.fontSize = size + "px";

    if (
      messageElement.scrollHeight <= availableHeight &&
      messageElement.scrollWidth <= availableWidth
    ) {
      break;
    }

    size--;
  }
}

async function unlockAudio() {
  if (!soundEnabled || !AudioContextClass) return;

  try {
    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }
  } catch (error) {
    console.warn("Audio unavailable:", error);
  }
}

function playTone(frequency, start, duration, type, volume) {
  if (
    !audioContext ||
    audioContext.state !== "running"
  ) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const now = audioContext.currentTime;

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(
    frequency, now + start
  );

  gain.gain.setValueAtTime(0.0001, now + start);
  gain.gain.exponentialRampToValueAtTime(
    volume, now + start + 0.02
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, now + start + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(now + start);
  oscillator.stop(now + start + duration + 0.02);
}

function playNightmareSound() {
  if (!soundEnabled || !audioContext) return;

  // Low ominous impact
  playTone(90, 0, 0.65, "sawtooth", 0.12);
  playTone(55, 0, 0.8, "sine", 0.2);

  // Descending horror chime
  playTone(440, 0.12, 0.45, "sine", 0.11);
  playTone(330, 0.32, 0.55, "sine", 0.1);
  playTone(220, 0.55, 0.9, "triangle", 0.12);
}

function clearWindows() {
  windows.forEach(element => {
    element.classList.remove("active");
    element.querySelector(".message").textContent = "";
  });
}

async function triggerNightmare() {
  // Unlock browser audio from a user gesture.
  await unlockAudio();

  clearTimeout(resetTimer);
  clearWindows();

  const windowIndex = nextWindowIndex();
  const messageIndex = nextMessageIndex();

  const selectedWindow = windows[windowIndex];
  const messageElement =
    selectedWindow.querySelector(".message");

  messageElement.textContent = horrors[messageIndex];
  fitText(messageElement);

  // Restart the reveal animation.
  void selectedWindow.offsetWidth;

  selectedWindow.classList.add("active");
  playNightmareSound();

  statusElement.textContent = "YOUR NIGHTMARE HAS ARRIVED.";

  resetTimer = setTimeout(() => {
    clearWindows();
    statusElement.textContent =
      "AWAITING YOUR NEXT VICTIM...";
  }, 5000);
}

triggerButton.addEventListener("click", triggerNightmare);

soundButton.addEventListener("click", async () => {
  soundEnabled = !soundEnabled;

  soundButton.textContent = soundEnabled
    ? "🔊 SOUND ON"
    : "🔇 SOUND OFF";

  if (soundEnabled) {
    await unlockAudio();
    playTone(440, 0, 0.15, "sine", 0.08);
  }
});

fullscreenButton.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.warn("Fullscreen unavailable:", error);
  }
});

document.addEventListener("keydown", event => {
  if (
    event.code === "Space" &&
    !event.repeat &&
    event.target.tagName !== "BUTTON"
  ) {
    event.preventDefault();
    triggerNightmare();
  }
});

// Refit visible text if the browser window changes size.
window.addEventListener("resize", () => {
  const activeMessage =
    document.querySelector(".window.active .message");

  if (activeMessage) {
    fitText(activeMessage);
  }
});

// Optional future sensor integration:
// Call triggerNightmare() when motion is detected.
// Browser audio must first be unlocked by user interaction.
</script>

</body>
</html>
