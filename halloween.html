<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The House of Everyday Horrors</title>
<style>
:root{color-scheme:dark;--red:#ff583f;--gold:#d6aa70}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,#30201b,#0c0b0d 72%);font-family:Georgia,serif;color:#f2d9b5;display:grid;place-items:center;padding:24px}.wrap{width:min(1050px,100%)}.sign{border:12px ridge #493025;box-shadow:0 0 0 4px #160e0c,0 18px 55px #000b,inset 0 0 35px #000;background:linear-gradient(145deg,#261a17,#110e0e);padding:clamp(14px,3vw,35px);border-radius:12px}h1{text-align:center;color:#db4e3b;text-shadow:0 2px #2e0908,0 0 20px #8e2119;font-size:clamp(27px,5vw,59px);letter-spacing:.05em;margin:0}header p{text-align:center;letter-spacing:.28em;color:#c3a58d;font:12px system-ui;margin:12px 0 27px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.panel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:clamp(120px,17vw,183px);padding:15px 10px;text-align:center;background:#201816;border:5px ridge #52362b;box-shadow:inset 0 0 22px #000;border-radius:4px;transition:background .16s,box-shadow .16s,color .16s}.panel .symbol{font:clamp(20px,3vw,33px) system-ui;filter:grayscale(1);opacity:.3}.panel .msg{font-family:Impact,'Arial Narrow',sans-serif;font-stretch:condensed;font-weight:800;font-size:clamp(12px,1.9vw,22px);line-height:1.25;letter-spacing:.035em;color:#7d6258}.panel.on{background:radial-gradient(ellipse,#ffac75,#ed563b 70%,#9c2a21);box-shadow:0 0 24px #f65a36a0,inset 0 0 25px #ffbc75;border-color:#a96342;animation:flare .3s ease-out}.panel.on .msg{color:#240e0a;text-shadow:0 1px #ffc2a0}.panel.on .symbol{opacity:1;filter:none}@keyframes flare{from{filter:brightness(2.3)}to{filter:brightness(1)}}.controls{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:25px}button{cursor:pointer;border:2px solid #c37452;border-radius:6px;padding:13px 22px;background:#8e2c23;color:#fff3e5;font:bold 16px system-ui;letter-spacing:.03em}button:hover{background:#b53b2c}button.secondary{background:#29211e;border-color:#655044}.hint{text-align:center;font:13px system-ui;color:#aa988b;margin:16px 0 0}.status{text-align:center;font:14px system-ui;color:#efad7e;min-height:20px;margin:15px 0 0}@media(max-width:620px){.grid{gap:7px}.panel{min-height:125px;padding:8px 4px;border-width:3px}.panel .msg{font-size:clamp(11px,2.7vw,16px)}.panel .symbol{font-size:23px}.sign{border-width:7px;padding:12px}header p{letter-spacing:.12em}}
</style>
</head>
<body><main class="wrap"><section class="sign"><header><h1>THE HOUSE OF<br>EVERYDAY HORRORS</h1><p>ONE STEP. ONE NIGHTMARE.</p></header><div class="grid" id="grid"></div><div class="controls"><button id="trigger">👣 STEP INTO YOUR NIGHTMARE</button><button class="secondary" id="reset">RESET</button><button class="secondary" id="sound">🔇 SOUND OFF</button></div><p class="status" id="status" aria-live="polite">Waiting for the next victim…</p><p class="hint">Click the trigger or press Space. One random window lights up for 5 seconds. Fullscreen: F11.</p></section></main>
<script>
const horrors=[['♨','YOU LEFT THE STOVE ON.'],['🎙','YOUR MIC WAS ON THE WHOLE TIME.'],['✉','YOU CLICKED REPLY ALL.'],['♥','YOU JUST LIKED A PHOTO FROM 2017.'],['🎓','YOU JUST CALLED YOUR TEACHER MOM.'],['♫','YOUR PHONE CONNECTED TO THE BLUETOOTH SPEAKER.'],['?','SOMEONE SAYS, “REMEMBER ME?”'],['👻','YOU’RE THE ONLY ONE WEARING A COSTUME.'],['♟','IT’S TIME FOR ICEBREAKERS.']];
const grid=document.querySelector('#grid'),status=document.querySelector('#status');let last=-1,timer=null,soundOn=false,audioCtx=null;
horrors.forEach(([icon,msg])=>{let p=document.createElement('div');p.className='panel';p.innerHTML='<div class="symbol"></div><div class="msg"></div>';p.querySelector('.symbol').textContent=icon;p.querySelector('.msg').textContent=msg;grid.appendChild(p)});
const panels=[...grid.children];function beep(){if(!soundOn)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(240,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(75,audioCtx.currentTime+.35);g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.45);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.46)}catch(e){}}
function reset(){clearTimeout(timer);panels.forEach(p=>p.classList.remove('on'));status.textContent='Waiting for the next victim…'}
function trigger(){clearTimeout(timer);let n=Math.floor(Math.random()*(panels.length-1));if(n>=last)n++;last=n;panels.forEach((p,i)=>p.classList.toggle('on',i===n));status.textContent='YOUR NIGHTMARE HAS BEEN SELECTED.';beep();timer=setTimeout(reset,5000)}
document.querySelector('#trigger').onclick=trigger;document.querySelector('#reset').onclick=reset;document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'};document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();trigger()}});
// Hardware integration: call window.triggerNightmare() from your sensor bridge.
window.triggerNightmare=trigger;
</script></body></html>
